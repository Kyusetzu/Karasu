name: CI

# Pull requests only: release.yml already runs the same verify on every push to main and is what gates what ships.
on:
  pull_request:
    # The website has its own workflows, and prose, screenshots and issue forms build nothing.
    paths-ignore:
      - "site/**"
      - ".github/workflows/pages.yml"
      - "*.md"
      - "assets/screenshots/**"
      - ".github/ISSUE_TEMPLATE/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      # Shared with the Nightly's key and saved only there: a PR reads main's cache and never crowds it out of the 10 GB.
      - name: Cache Rust build
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri
          shared-key: windows
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install dependencies
        run: npm ci

      # The same gate developers run locally, so the two cannot drift apart.
      - name: Verify (typecheck + frontend tests + Rust tests)
        run: npm run verify

      - name: Build release (NSIS installer)
        run: npm run tauri build

      - name: Rename installer to the full 4-part version
        shell: pwsh
        run: ./scripts/release/rename-installer.ps1

      - name: Upload installer artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: karasu-windows-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14

  # ubuntu-22.04, not latest: an AppImage carries no glibc, so build on the oldest one the file should run on.
  linux-build:
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      # libdbus-1 for keyring, patchelf and file for the bundler, appindicator so the tray library can be copied in.
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libglib2.0-dev \
            libdbus-1-dev \
            patchelf \
            file

      - name: Cache Rust build
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri
          shared-key: linux
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install dependencies
        run: npm ci

      # The same spell-check `verify` runs where typos is installed; the runner has none, so the action supplies it.
      - name: typos
        uses: crate-ci/typos@512fc24f32f44ab01972217aaaf3dc86ec234d53 # v1.50.2

      - name: Verify (typecheck + frontend tests + Rust tests)
        run: npm run verify

      # Advisories, licences, bans and sources against deny.toml; worth seeing on the PR without being able to block it.
      - name: cargo deny
        continue-on-error: true
        uses: EmbarkStudios/cargo-deny-action@c3bbe7e4e3f7baeee1a3dd9aec0a3b2aded580fb # v2.1.1
        with:
          manifest-path: src-tauri/Cargo.toml
          command: check

      # Unused files, exports and dependencies; silent when clean, and a finding is a question, not a failure.
      - name: knip
        continue-on-error: true
        run: npx knip

      # Clean at the time of writing; a new stable's new lint must not block a PR, only show on it.
      - name: Clippy
        continue-on-error: true
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Build AppImage
        run: npx tauri build
        env:
          # linuxdeploy strips binaries by default and has been known to corrupt the runtime doing it.
          NO_STRIP: true

      # The tray library is dlopen'd and invisible to linuxdeploy; warn only, since the app survives a missing tray.
      - name: Check the AppImage carries the tray library
        working-directory: src-tauri/target/release/bundle/appimage
        run: |
          ./*.AppImage --appimage-extract > /dev/null
          ls squashfs-root/usr/lib | grep -i appindicator \
            || echo "::warning::AppImage carries no appindicator library; the tray will be absent"

      - name: Upload AppImage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: karasu-linux-appimage
          path: src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
          retention-days: 14
