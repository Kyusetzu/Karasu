name: CI

on:
  push:
    branches: ["main"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      # The same gate developers run locally, so the two cannot drift apart:
      # typecheck, then vitest, then cargo test.
      - name: Verify (typecheck + frontend tests + Rust tests)
        run: npm run verify

      - name: Build release (NSIS installer)
        run: npm run tauri build

      - name: Rename installer to the full 4-part version
        shell: pwsh
        run: ./scripts/release/rename-installer.ps1

      - name: Upload installer artifact
        uses: actions/upload-artifact@v5
        with:
          name: karasu-windows-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  # Experimental Linux groundwork: make sure the backend still compiles and its
  # tests pass on Ubuntu (the bundle is not published yet).
  linux-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libglib2.0-dev

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Verify (typecheck + frontend tests + Rust tests)
        run: npm run verify
