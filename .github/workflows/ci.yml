name: CI

# Pull requests only: release.yml already runs the same verify on every push to main and is what gates what ships.
on:
  pull_request:
    # The website has its own workflows; a site-only PR need not build the app twice.
    paths-ignore:
      - "site/**"
      - ".github/workflows/pages.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      # The same gate developers run locally, so the two cannot drift apart.
      - name: Verify (typecheck + frontend tests + Rust tests)
        run: npm run verify

      - name: Build release (NSIS installer)
        run: npm run tauri build

      - name: Rename installer to the full 4-part version
        shell: pwsh
        run: ./scripts/release/rename-installer.ps1

      - name: Upload installer artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: karasu-windows-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  # ubuntu-22.04, not latest: an AppImage carries no glibc, so build on the oldest one the file should run on.
  linux-build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      # libdbus-1 for keyring, patchelf and file for the bundler, appindicator so the tray library can be copied in.
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libglib2.0-dev \
            libdbus-1-dev \
            patchelf \
            file

      - name: Cache Rust build
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Verify (typecheck + frontend tests + Rust tests)
        run: npm run verify

      - name: Build AppImage
        run: npx tauri build
        env:
          # linuxdeploy strips binaries by default and has been known to corrupt the runtime doing it.
          NO_STRIP: true

      # The tray library is dlopen'd and invisible to linuxdeploy; warn only, since the app survives a missing tray.
      - name: Check the AppImage carries the tray library
        working-directory: src-tauri/target/release/bundle/appimage
        run: |
          ./*.AppImage --appimage-extract > /dev/null
          ls squashfs-root/usr/lib | grep -i appindicator \
            || echo "::warning::AppImage carries no appindicator library; the tray will be absent"

      - name: Upload AppImage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: karasu-linux-appimage
          path: src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
