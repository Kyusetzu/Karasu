name: CI

# Pull requests only. `release.yml` fires on every push to `main` and runs the
# same `npm run verify` in both of its jobs, so a push trigger here meant four
# full builds per commit for one answer — and, worse, two answers: on
# 2026-08-13 CI went green while Release failed on the same commit, and the
# README badge reported the green one. The badge now points at Release, which
# is the workflow that actually gates what ships.
on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      # The same gate developers run locally, so the two cannot drift apart:
      # typecheck, then vitest, then cargo test.
      - name: Verify (typecheck + frontend tests + Rust tests)
        run: npm run verify

      - name: Build release (NSIS installer)
        run: npm run tauri build

      - name: Rename installer to the full 4-part version
        shell: pwsh
        run: ./scripts/release/rename-installer.ps1

      - name: Upload installer artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: karasu-windows-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  # Builds the Linux artifact Karasu actually ships: one AppImage serving both
  # Ubuntu and Arch.
  #
  # Pinned to 22.04 rather than ubuntu-latest, which is 24.04. An AppImage
  # carries its own libraries but not glibc, so one built against 24.04's 2.39
  # refuses to start on Ubuntu 22.04. Building on 22.04 (glibc 2.35) covers
  # Ubuntu 22.04+, Debian 12+ and Arch from a single file, which is the whole
  # reason for choosing AppImage.
  linux-build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      # libdbus-1-dev is not new: keyring's sync-secret-service feature reaches
      # libdbus-sys, so the build has always needed it. It only ever passed
      # because the runner happens to preinstall it. patchelf and file are what
      # the AppImage bundler shells out to. No libssl-dev — reqwest is on
      # rustls. libayatana-appindicator3-dev is load-bearing for the bundle,
      # not just the build: the bundler can only copy the tray library into the
      # AppImage if it exists on the builder.
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libglib2.0-dev \
            libdbus-1-dev \
            patchelf \
            file

      - name: Cache Rust build
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Verify (typecheck + frontend tests + Rust tests)
        run: npm run verify

      - name: Build AppImage
        run: npx tauri build
        env:
          # linuxdeploy strips binaries by default and has been known to
          # corrupt the runtime doing it.
          NO_STRIP: true

      # The tray library is dlopen'd, never linked, so linuxdeploy's DT_NEEDED
      # walk cannot find it — it is copied in only if Tauri's own bundler step
      # does so. A warning rather than a failure: the app now survives a
      # missing tray, so this reports packaging quality, it does not gate the
      # build. If it fires, map the library in bundle.linux.appimage.files.
      - name: Check the AppImage carries the tray library
        working-directory: src-tauri/target/release/bundle/appimage
        run: |
          ./*.AppImage --appimage-extract > /dev/null
          ls squashfs-root/usr/lib | grep -i appindicator \
            || echo "::warning::AppImage carries no appindicator library; the tray will be absent"

      - name: Upload AppImage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: karasu-linux-appimage
          path: src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
