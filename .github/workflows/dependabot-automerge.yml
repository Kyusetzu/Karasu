name: Dependabot auto-merge

# Merges a Dependabot PR once CI or Site is green on its head; workflow_run needs no branch protection to wait.
on:
  workflow_run:
    workflows: ["CI", "Site"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  merge:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.actor.login == 'dependabot[bot]' &&
      startsWith(github.event.workflow_run.head_branch, 'dependabot/')
    runs-on: ubuntu-latest
    steps:
      - name: Merge the pull request the run belongs to
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          set -euo pipefail
          pr=$(gh api "repos/$REPO/pulls?head=${REPO%%/*}:$BRANCH&state=open" --jq '.[0] // empty')
          if [ -z "$pr" ]; then
            echo "no open pull request for $BRANCH — nothing to merge"
            exit 0
          fi
          number=$(jq -r .number <<<"$pr")
          author=$(jq -r .user.login <<<"$pr")
          head=$(jq -r .head.sha <<<"$pr")
          headrepo=$(jq -r .head.repo.full_name <<<"$pr")
          title=$(jq -r .title <<<"$pr")
          if [ "$author" != "dependabot[bot]" ]; then
            echo "#$number was opened by $author, not Dependabot — leaving it"
            exit 0
          fi
          if [ "$headrepo" != "$REPO" ]; then
            echo "#$number comes from $headrepo — leaving it"
            exit 0
          fi
          if [ "$head" != "$SHA" ]; then
            echo "#$number moved on: the run tested $SHA, the head is now $head — the next run decides"
            exit 0
          fi
          echo "merging #$number ($title) at $SHA"
          # No checkout here: --repo names the repository, and --delete-branch would need a local clone to switch away from.
          gh pr merge "$number" --repo "$REPO" --squash \
            --subject "$title (#$number)" \
            --body "Merged automatically: the checks on $SHA passed ($RUN_URL)."
