name: Issue labels

# Adds labels from the form's answers: type from its headings, platform from a dropdown or the diagnostics OS row.

on:
  issues:
    types: [opened, edited]

permissions:
  issues: write

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.issue.body ?? "";

            // The first non-empty line under a "### <label>" heading; plain indexOf, since the labels carry question marks.
            const answer = (label) => {
              const heading = `### ${label}`;
              const at = body.indexOf(heading);
              if (at === -1) return "";
              const line = body
                .slice(at + heading.length)
                .split("\n")
                .map((l) => l.trim())
                .find((l) => l !== "");
              return line ?? "";
            };

            const labels = new Set();

            // Type, from headings only one form renders; two per form, since a reporter may delete the first section.
            if (/^### (What happened\?|Steps to reproduce)/m.test(body)) labels.add("bug");
            if (/^### (What is the problem\?|What should it do instead\?)/m.test(body)) labels.add("enhancement");

            // Platform: the feature form asks outright; a bug report says it in the install dropdown or the diagnostics OS row.
            const platform = answer("Does this apply to a particular platform?").toLowerCase();
            const install = answer("How did you install it?").toLowerCase();
            const os = (body.match(/^\|\s*OS\s*\|\s*([a-z]+)\s*\|/mi)?.[1] ?? "").toLowerCase();
            for (const name of ["windows", "linux", "android"]) {
              if (platform === name || os === name || install.startsWith(name)) labels.add(name);
            }

            const have = new Set(context.payload.issue.labels.map((l) => l.name));
            const add = [...labels].filter((l) => !have.has(l));
            if (add.length === 0) {
              core.info("nothing to add");
              return;
            }
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.issue.number,
              labels: add,
            });
            core.info(`added: ${add.join(", ")}`);
