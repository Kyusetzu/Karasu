name: Links

# Outbound links die quietly; once a week lychee walks the docs, the issue forms and the website's copy.
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: lychee
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          # lychee.toml carries the exclusions; the GitHub token lifts the anonymous rate limit on the release links.
          args: --config lychee.toml -- '*.md' '.github/**/*.md' '.github/ISSUE_TEMPLATE/*.yml' 'site/src/**/*.ts' 'site/src/**/*.tsx' 'site/index.html' 'site/*.md' 'src/i18n/*.ts'
          fail: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
