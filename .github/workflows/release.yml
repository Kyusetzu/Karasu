name: Release

on:
  push:
    branches: ["main"]
    # A tag build is the immutable half. `main` keeps publishing the rolling
    # `latest` prerelease; `v*` publishes a release under its own tag, whose
    # assets the prune step at the bottom of this file cannot reach.
    tags: ["v*"]

# Keyed on the ref, not one global slot. `git push --follow-tags` delivers two
# separate push events — the branch, then the tag — and under a shared group
# with `cancel-in-progress` they cancel each other: either the rolling build
# dies, or the tag run does and leaves a git tag with no release behind it.
# `if: !cancelled()` cannot rescue that, because a run cancelled before its jobs
# start has no jobs left to evaluate it. Two quick pushes to `main` still
# serialise, which is what the original group was protecting.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

# Read by default; only the job that actually publishes gets write. This was
# workflow-wide `write`, which handed the same power to `build-linux` — a job
# that checks out, runs `npm ci` and uploads an artifact, and never touches the
# GitHub API. A compromised transitive npm dependency's install script, or any
# of the third-party actions in that job, could have read $GITHUB_TOKEN and
# pushed to main or replaced the published assets. ci.yml already had this
# right.
permissions:
  contents: read

jobs:
  # Everything that can reject a tag without compiling anything, run first and
  # alone. It is seconds of work and it gates the rest.
  #
  # This lived inside `build-and-publish`, whose comment claimed it ran
  # "deliberately before the ~15-minute build". It did not: that job carries
  # `needs: [build-linux, android-build]`, so on a real run the check fired
  # eleven minutes in — measured, not guessed. The failure mode it exists to
  # prevent is the expensive one: the tag is already pushed by then, and a tag
  # that disagrees with the commit it points at, or one whose CHANGELOG section
  # is missing, cost a quarter of an hour before saying so.
  #
  # Ubuntu rather than Windows: pwsh is preinstalled there too, the scripts are
  # cross-platform PowerShell already, and a Linux runner starts in seconds.
  precheck:
    runs-on: ubuntu-22.04
    outputs:
      tag: ${{ steps.target.outputs.tag }}
      name: ${{ steps.target.outputs.name }}
      prerelease: ${{ steps.target.outputs.prerelease }}
      rolling: ${{ steps.target.outputs.rolling }}
      version: ${{ steps.target.outputs.version }}
      suffix: ${{ steps.target.outputs.suffix }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      # The four-part version lives in five files and only bump-version.mjs
      # writes all of them at once, so a hand-edit or a bad merge can leave them
      # disagreeing. The consequence is not cosmetic: `latest.json` is generated
      # from package.json plus COMMIT_NUMBER, while the running app compares
      # against the COMMIT_NUMBER compiled into it. Let those describe two
      # different builds and every install re-downloads its own update forever,
      # with only a new release to stop it.
      #
      # No `npm ci` in front of it: this reads files and compares strings, and
      # installing the tree would put a minute back into the thing being made
      # fast.
      - name: Check the version files agree
        run: node scripts/bump-version.mjs --check

      # Which release this run is, decided once. Everything downstream reads
      # these outputs, so the three literals that used to be `latest` / `Latest
      # build` / `prerelease: true` live in exactly one place.
      - name: Resolve release target
        id: target
        shell: pwsh
        run: |
          $ref = "${env:GITHUB_REF}"
          if ($ref -like "refs/tags/*") {
            $tag = $ref -replace "^refs/tags/", ""
            $core = $tag -replace "^v", ""
            $pkg = (Get-Content package.json -Raw | ConvertFrom-Json).version
            # A prerelease tag (v1.0.0-rc1) keeps its suffix in the name but
            # must still agree on the semver core with what is committed.
            $tagCore = ($core -split "-")[0]
            if ($tagCore -ne $pkg) {
              throw "Tag $tag says $tagCore but package.json says $pkg -- bump the version on the tagged commit, or tag the right commit."
            }
            # `-` in the tag is semver's prerelease marker; GitHub should mark
            # those as prereleases and a bare v1.0.0 as a real one.
            $pre = if ($core -match "-") { "true" } else { "false" }
            # Everything after the first dash, for the artifact filenames. The
            # bundler names them from package.json's semver core alone, so
            # v1.0.0-rc1 and v1.0.0 produced identically-named installers --
            # indistinguishable once downloaded, and the rolling prune keeps
            # assets by name. Filenames only: latest.json's `version` stays
            # clean semver + build metadata.
            $suffix = if ($core -match "-") { ($core -split "-", 2)[1] } else { "" }
            $out = @("tag=$tag", "name=Karasu $core", "prerelease=$pre", "rolling=false", "version=$core", "suffix=$suffix")
            # The notes are composed after the build, from CHANGELOG.md, and
            # the slicer throws when the section is missing. Checked here too,
            # so a tag with no changelog entry costs seconds rather than
            # failing at the end of a fifteen-minute build with the tag
            # already pushed and no release to show for it. Note this means a
            # prerelease tag needs its own `## 1.0.0-rc1` section.
            ./scripts/release/release-notes.ps1 -Version $core -OutFile notes-precheck.md | Out-Null
            Remove-Item notes-precheck.md -ErrorAction SilentlyContinue
          }
          else {
            $out = @("tag=latest", "name=Latest build", "prerelease=true", "rolling=true", "version=", "suffix=")
          }

          # `Out-File -Append -Encoding utf8`, the same idiom rename-installer.ps1
          # already uses, rather than `>>` -- the redirect's default encoding is
          # a shell-version detail and this file is parsed by the runner.
          $out | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          $summary = ($out | ForEach-Object { $_ -replace "^[^=]+=", "" })
          Write-Host "Publishing to tag '$($summary[0])' as '$($summary[1])' (prerelease=$($summary[2]), rolling=$($summary[3]))"

  # Builds the Linux artifact and hands it to the publisher below as an
  # artifact. A matrix was the obvious shape and the wrong one: every
  # post-build step here is PowerShell against `bundle/nsis`, `latest.json` has
  # to describe *both* platforms so it can only be written once both builds
  # exist, and the prune step would run twice with each leg deleting the
  # other's asset.
  #
  # ubuntu-22.04 for glibc reach — see ci.yml for the reasoning.
  build-linux:
    runs-on: ubuntu-22.04
    # Hard, unlike the publisher's soft dependency below: there is no point
    # spending fifteen minutes of runner time on a tag that will be refused.
    needs: precheck
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libglib2.0-dev \
            libdbus-1-dev \
            patchelf \
            file

      - name: Cache Rust build
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Verify (typecheck + frontend tests + Rust tests)
        run: npm run verify

      - name: Build AppImage
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          NO_STRIP: true
        run: npx tauri build --config '{"bundle":{"createUpdaterArtifacts":true}}'

      # First release run: confirm what the updater artifacts are actually
      # called before trusting latest.json's linux-x86_64 url.
      - name: List bundle output
        run: ls -la src-tauri/target/release/bundle/appimage

      # The suffix is recomputed here rather than plumbed across jobs: this job
      # runs in parallel with the one that resolves the release target, so
      # there is no output to read yet. Same rule, one line, from the same ref.
      - name: Rename AppImage to the full 4-part version
        shell: pwsh
        run: |
          $ref = "${env:GITHUB_REF}"
          $suffix = ""
          if ($ref -like "refs/tags/*") {
            $core = ($ref -replace "^refs/tags/", "") -replace "^v", ""
            if ($core -match "-") { $suffix = ($core -split "-", 2)[1] }
          }
          ./scripts/release/rename-appimage.ps1 -Suffix $suffix

      # The tray library is dlopen'd, never linked, so linuxdeploy's DT_NEEDED
      # walk cannot find it — it is copied in only if Tauri's own bundler step
      # does so. ci.yml has had this check since the tray landed; this job is
      # the one whose artifact actually reaches users, and it did not.
      #
      # A warning rather than a failure, exactly as in ci.yml: the app survives
      # a missing tray, so this reports packaging quality and must not hold back
      # a release. If it fires, map the library in bundle.linux.appimage.files.
      - name: Check the AppImage carries the tray library
        working-directory: src-tauri/target/release/bundle/appimage
        run: |
          ./*.AppImage --appimage-extract > /dev/null
          ls squashfs-root/usr/lib | grep -i appindicator \
            || echo "::warning::AppImage carries no appindicator library; the tray will be absent"
          rm -rf squashfs-root

      - name: Upload AppImage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: karasu-linux
          path: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/appimage/*.AppImage.sig
          if-no-files-found: error

  build-and-publish:
    runs-on: windows-latest
    # The only job that writes: it creates the release and prunes its assets.
    permissions:
      contents: write
    # Soft: `!cancelled()` plus continue-on-error on the download means a broken
    # Linux build costs the Linux artifact, not the Windows release. The
    # manifest generator emits only the platforms whose artifacts it finds.
    #
    # `!cancelled()` rather than `always()`: `always()` is true even when the
    # run has been cancelled, and this workflow sets cancel-in-progress. Two
    # pushes in quick succession — routine here, since every commit bumps the
    # version — would cancel run A's Linux job and let A publish anyway, racing
    # run B. If A landed second it would overwrite latest.json with the older
    # build and its prune step would delete B's assets, since B's filenames are
    # not in A's $keep. `!cancelled()` keeps the soft dependency identically and
    # closes that.
    #
    # android-build joins the same soft dependency: when the signing secrets
    # exist it hands signed APKs over as an artifact, and a red Android leg
    # costs the APKs, never the desktop release.
    #
    # `precheck` joins as a *hard* dependency: a run whose tag was rejected has
    # nothing to publish, and `!cancelled()` would otherwise let this job go
    # ahead on a failed precheck exactly as it goes ahead on a failed Linux leg.
    # The two build jobs stay soft.
    needs: [precheck, build-linux, android-build]
    if: ${{ !cancelled() && needs.precheck.result == 'success' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      # Before anything is built or published, and for both arms: a rolling
      # build ships to the prerelease channel and is installed by real users,
      # so it needs this as much as a tag does.
      #
      # Flattened into linux-artifacts/. continue-on-error so a missing or
      # failed Linux build degrades to a Windows-only release rather than
      # taking the whole thing down.
      - name: Download the Linux AppImage
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: karasu-linux
          path: linux-artifacts

      # Exists only when the android job found its signing secrets; absent, the
      # release simply carries no APKs and the notes say nothing about Android.
      - name: Download the Android APKs
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: karasu-android-release
          path: android-artifacts

      # This job publishes straight to users, and it triggers on the same push
      # as ci.yml rather than after it, so nothing was gating it. `tauri build`
      # only runs `vite build` -- no typecheck, no vitest, no cargo test -- so a
      # failing test could ship while CI went red beside it. Same line as
      # ci.yml's, verbatim, so the two cannot drift.
      - name: Verify (typecheck + frontend tests + Rust tests)
        run: npm run verify

      - name: Build release (NSIS installer)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx tauri build --config '{"bundle":{"createUpdaterArtifacts":true}}'

      - name: Rename installer to the full 4-part version
        id: installer
        shell: pwsh
        env:
          RELEASE_SUFFIX: ${{ needs.precheck.outputs.suffix }}
        run: ./scripts/release/rename-installer.ps1 -Suffix $env:RELEASE_SUFFIX

      # The tag matters here more than anywhere else: the manifest's download
      # URL is built from it, and a stable release whose manifest points into
      # the rolling tag has its installer deleted by the prune step on the next
      # unrelated push to main.
      # `-Notes` matters because the default is a sentence about `main`. A
      # tagged release published that verbatim into its own public latest.json,
      # so the manifest for Karasu 1.0.0 described itself as an automated build
      # from the latest commit.
      - name: Generate update manifest (latest.json)
        shell: pwsh
        env:
          RELEASE_TAG: ${{ needs.precheck.outputs.tag }}
          RELEASE_NAME: ${{ needs.precheck.outputs.name }}
        run: >
          ./scripts/release/generate-update-manifest.ps1
          -Tag $env:RELEASE_TAG
          -Notes "$env:RELEASE_NAME -- see https://github.com/Kyusetzu/Karasu/releases/tag/$env:RELEASE_TAG"

      - name: Generate checksum
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path "src-tauri/target/release/bundle/nsis" -Filter *.exe |
              Sort-Object LastWriteTime -Descending |
              Select-Object -First 1
          $lines = @()
          $hash = Get-FileHash -Algorithm SHA256 -Path $installer.FullName
          $lines += "$($hash.Hash.ToLower())  $($installer.Name)"
          $appimage = Get-ChildItem -Path "linux-artifacts" -Filter *.AppImage -ErrorAction SilentlyContinue |
              Select-Object -First 1
          if ($appimage) {
            $h = Get-FileHash -Algorithm SHA256 -Path $appimage.FullName
            $lines += "$($h.Hash.ToLower())  $($appimage.Name)"
          }
          foreach ($apk in Get-ChildItem -Path "android-artifacts" -Filter *.apk -ErrorAction SilentlyContinue) {
            $h = Get-FileHash -Algorithm SHA256 -Path $apk.FullName
            $lines += "$($h.Hash.ToLower())  $($apk.Name)"
          }
          # LF, explicitly. `Out-File` terminates lines with the platform's
          # newline, and this step runs on windows-latest — so the file went out
          # with CRLF. GNU coreutils takes everything after the two-space
          # separator as the filename, trailing \r included, so `sha256sum -c`
          # reported "FAILED open or read" for every line. The release body
          # tells Linux users to verify with exactly that command.
          [IO.File]::WriteAllText(
            (Join-Path $PWD "SHA256SUMS.txt"),
            (($lines -join "`n") + "`n"),
            [Text.UTF8Encoding]::new($false)
          )

      - name: Scan installer with VirusTotal
        id: virustotal
        continue-on-error: true
        uses: crazy-max/ghaction-virustotal@936d8c5c00afe97d3d9a1af26d017cfdf26800a2 # v5
        with:
          vt_api_key: ${{ secrets.VT_API_KEY }}
          request_rate: 4
          files: |
            src-tauri/target/release/bundle/nsis/*.exe

      # Written to a file rather than passed as a `body:` block scalar. A
      # `${{ }}` in YAML is textual substitution before anything parses it, and
      # for a tagged release this body is arbitrary CHANGELOG markdown — full of
      # backticks, dollars and quotes, in a job holding the signing key. The
      # prune step below already documents that class of bug for a single
      # filename; this is worse input.
      - name: Compose release notes
        shell: pwsh
        env:
          NOTES_VERSION: ${{ needs.precheck.outputs.version }}
          NOTES_SHA: ${{ github.sha }}
          NOTES_VT: ${{ steps.virustotal.outputs.analysis || 'unavailable for this release' }}
        run: |
          # `-Android` only when APKs actually came down -- the paragraph must
          # not describe assets the release does not carry. A HASHTABLE splat:
          # array splatting passes "-Android" as a positional string and the
          # switch stays false, which is how the first signed release shipped
          # its APKs with notes that never mentioned them.
          $android = @{}
          if (Get-ChildItem -Path "android-artifacts" -Filter *.apk -ErrorAction SilentlyContinue) {
            $android = @{ Android = $true }
          }
          ./scripts/release/release-notes.ps1 `
            -Version $env:NOTES_VERSION `
            -Sha $env:NOTES_SHA `
            -VirusTotal $env:NOTES_VT `
            -OutFile notes.md @android

      # `softprops/action-gh-release` creates a tag that does not exist and
      # reuses one that does — it never *moves* it. So the rolling `latest` tag
      # still pointed at the commit it was first created on, hundreds of commits
      # back, while its assets were rebuilt every push. GitHub attaches
      # auto-generated source archives to the tag, so the release paired a
      # current installer with source from months earlier — and that release page
      # is the exact URL the app hands users as "what's new".
      #
      # Rolling only: a version tag must never move, which is the entire point
      # of having one.
      - name: Move the rolling tag to this commit
        if: ${{ needs.precheck.outputs.rolling == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh api -X PATCH "repos/${env:GITHUB_REPOSITORY}/git/refs/tags/latest" `
            -f sha="${env:GITHUB_SHA}" -F force=true | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "Could not move the rolling tag to ${env:GITHUB_SHA}." }

      # One publish step for both shapes. A second copy would duplicate the
      # whole file list, and the two would drift the first time one changed.
      - name: Publish release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          tag_name: ${{ needs.precheck.outputs.tag }}
          name: ${{ needs.precheck.outputs.name }}
          prerelease: ${{ needs.precheck.outputs.prerelease }}
          body_path: notes.md
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            linux-artifacts/*.AppImage
            android-artifacts/*.apk
            SHA256SUMS.txt
            latest.json

      # The installer name carries the 4-part version, so every commit uploads
      # a differently-named asset that the publish step has nothing to
      # overwrite -- left alone, the rolling release accumulates one installer
      # per commit forever. Prune *after* uploading, so the release is never
      # momentarily without an installer for the updater to fetch.
      #
      # Rolling builds only. The `gh` calls below are already scoped to the
      # literal tag `latest`, so a tagged release's assets are safe from this by
      # construction — but on a tag run it would compute `$keep` from the *tag*
      # build's filenames and then delete the rolling installer against that
      # list, seconds after an unrelated push published it. Guarded by `if:`,
      # never by emptying `$keep`.
      - name: Prune stale release assets
        if: ${{ needs.precheck.outputs.rolling == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          # Through the environment, not `${{ }}` inside the script body. A
          # workflow expression is substituted textually before pwsh parses the
          # line, and it landed inside a double-quoted string where `$` and `"`
          # are both live — so a productName containing `$` would have silently
          # expanded to nothing (the real installer then missing from $keep and
          # deleted seconds after upload), and one containing `"` would have
          # closed the string and run as code, in a job holding the signing key.
          INSTALLER: ${{ steps.installer.outputs.installer }}
        shell: pwsh
        run: |
          $keep = @($env:INSTALLER, "SHA256SUMS.txt", "latest.json")
          # Read from the downloaded folder rather than plumbing an output
          # across jobs — and it must be here, or the prune deletes the
          # AppImage seconds after uploading it.
          $appimage = Get-ChildItem -Path "linux-artifacts" -Filter *.AppImage -ErrorAction SilentlyContinue |
              Select-Object -First 1
          if ($appimage) { $keep += $appimage.Name }
          # The APKs too, read from the downloaded folder for the same reason --
          # anything uploaded but missing from $keep is deleted seconds later.
          foreach ($apk in Get-ChildItem -Path "android-artifacts" -Filter *.apk -ErrorAction SilentlyContinue) {
            $keep += $apk.Name
          }
          Write-Host "Keeping: $($keep -join ', ')"
          $assets = gh release view latest --json assets --jq '.assets[].name'
          if ($LASTEXITCODE -ne 0) { throw "Could not list the release's assets." }
          # Failures are collected and thrown at the end rather than ignored.
          # The pwsh wrapper only appends `exit $LASTEXITCODE` once, so the
          # step's status reflected the *last* gh call alone: a transient
          # failure on the first deletion was overwritten by a later success,
          # the run stayed green, and the stale installer survived — the one
          # thing this step exists to prevent.
          $failed = @()
          foreach ($name in $assets) {
            if ($keep -notcontains $name) {
              Write-Host "Deleting stale asset: $name"
              gh release delete-asset latest $name --yes
              if ($LASTEXITCODE -ne 0) { $failed += $name }
            }
          }
          if ($failed) { throw "Could not delete: $($failed -join ', ')" }

  # The Android debug APK, on every push — a sideloadable artifact, not a
  # release asset: it is debug-signed, and the phone slice is still proving
  # itself. Runs beside the desktop legs and gates nothing; a red here means
  # the Android target broke, which `npm run verify` cannot see (CLAUDE.md:
  # Linux-only code does not compile on Windows, and Android-only code
  # compiles nowhere but here and scripts/android-check.ps1).
  # Two shapes, decided by whether the maintainer has added the signing
  # secrets. Without them: the debug APK it has always built, as a workflow
  # artifact. With them: signed release APKs (arm64 + universal), renamed to
  # the 4-part version and handed to build-and-publish as an artifact — that
  # job is still the only publisher. Debug-signed APKs must never become
  # release assets: installing one over a release-signed install fails on the
  # signature, and vice versa.
  android-build:
    runs-on: ubuntu-22.04
    # Same reason as build-linux.
    needs: precheck
    env:
      # Job-level `if:` cannot read secrets; steps key off this instead.
      HAS_ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_B64 != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v5.0.0
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          # All four, because the universal release APK bundles every ABI the
          # local build does; the debug leg only uses the first.
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Cache Rust build
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri

      # The runner images ship the SDK; the NDK pin matches the local
      # toolchain (scripts/android-check.ps1) so the two builds cannot drift.
      - name: Install NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;27.1.12297006" "platforms;android-36" "build-tools;36.0.0" "build-tools;35.0.0" > /dev/null
          # Exported at run time, where $ANDROID_HOME is the runner's real
          # machine environment. A step-level `env: NDK_HOME: ${{ env.ANDROID_HOME }}/…`
          # resolves against the workflow's env *context*, which does not
          # contain machine variables — it evaluated to "/ndk/…" and the leg
          # died with "Android NDK invalid" on its first real run.
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.1.12297006" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: npm ci

      # ------------------------- without secrets -------------------------

      - name: Build debug APK
        if: env.HAS_ANDROID_KEYSTORE != 'true'
        run: npx tauri android build --apk --target aarch64 --debug

      - name: Upload debug APK
        if: env.HAS_ANDROID_KEYSTORE != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: karasu-android-debug
          path: src-tauri/gen/android/app/build/outputs/apk/universal/debug/app-universal-debug.apk
          if-no-files-found: error

      # -------------------------- with secrets ---------------------------

      # The keystore and its passwords exist only in this ephemeral runner's
      # filesystem, in the gitignored path build.gradle.kts already reads.
      # NOTE for the maintainer: key.properties is Java's Properties format —
      # a password containing a backslash would need escaping. The generated
      # upload key's is plain alphanumeric.
      - name: Materialize the signing keystore
        if: env.HAS_ANDROID_KEYSTORE == 'true'
        shell: pwsh
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          $ks = Join-Path $env:RUNNER_TEMP "upload.keystore"
          [IO.File]::WriteAllBytes($ks, [Convert]::FromBase64String($env:KEYSTORE_B64))
          $props = @(
            "storeFile=$ks"
            "storePassword=$env:KEYSTORE_PASSWORD"
            "keyAlias=$env:KEY_ALIAS"
            "keyPassword=$env:KEY_PASSWORD"
          )
          [IO.File]::WriteAllLines("src-tauri/gen/android/app/key.properties", $props)

      # Two invocations on purpose: `--split-per-abi` builds the per-ABI
      # flavors *instead of* universal, and the cargo artifacts are shared so
      # the second run is mostly Gradle.
      - name: Build release APKs (universal + arm64)
        if: env.HAS_ANDROID_KEYSTORE == 'true'
        run: |
          npx tauri android build --apk
          npx tauri android build --apk --target aarch64 --split-per-abi

      # Renamed to Karasu_<4-part>_<flavor>.apk and collected flat, so the
      # publisher's download sees bare *.apk names.
      - name: Rename and collect release APKs
        if: env.HAS_ANDROID_KEYSTORE == 'true'
        shell: pwsh
        run: |
          $ref = "${env:GITHUB_REF}"
          $suffix = ""
          if ($ref -like "refs/tags/*") {
            $core = ($ref -replace "^refs/tags/", "") -replace "^v", ""
            if ($core -match "-") { $suffix = ($core -split "-", 2)[1] }
          }
          $universal = ./scripts/release/rename-apk.ps1 -Flavor universal -Suffix $suffix
          $arm64 = ./scripts/release/rename-apk.ps1 -Flavor arm64 -Suffix $suffix
          New-Item -ItemType Directory -Force android-apks | Out-Null
          Copy-Item $universal android-apks/
          Copy-Item $arm64 android-apks/

      - name: Upload release APKs
        if: env.HAS_ANDROID_KEYSTORE == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: karasu-android-release
          path: android-apks/*.apk
          if-no-files-found: error
