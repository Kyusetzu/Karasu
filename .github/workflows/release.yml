name: Release

on:
  push:
    branches: ["main"]
    # A tag build is the immutable half; main keeps publishing the rolling latest prerelease.
    tags: ["v*"]
    # A site commit must never build a Nightly; tag pushes ignore path filters, so a release is never held back.
    paths-ignore:
      - "site/**"
      - ".github/workflows/pages.yml"

# Keyed on the ref, not one slot: a branch push and its tag push arrive separately and must not cancel each other.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

# Read by default; only the job that publishes gets write, so a compromised build job cannot push or replace assets.
permissions:
  contents: read

jobs:
  # Whatever can reject a tag without compiling runs first, so a bad tag costs seconds rather than a full build.
  precheck:
    runs-on: ubuntu-22.04
    outputs:
      tag: ${{ steps.target.outputs.tag }}
      name: ${{ steps.target.outputs.name }}
      prerelease: ${{ steps.target.outputs.prerelease }}
      rolling: ${{ steps.target.outputs.rolling }}
      version: ${{ steps.target.outputs.version }}
      suffix: ${{ steps.target.outputs.suffix }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      # The five version files must agree, or every install re-downloads its own update forever.
      - name: Check the version files agree
        run: node scripts/bump-version.mjs --check

      # Which release this run is, decided once; everything downstream reads these outputs.
      - name: Resolve release target
        id: target
        shell: pwsh
        run: |
          $ref = "${env:GITHUB_REF}"
          if ($ref -like "refs/tags/*") {
            $tag = $ref -replace "^refs/tags/", ""
            $core = $tag -replace "^v", ""
            $pkg = (Get-Content package.json -Raw | ConvertFrom-Json).version
            # A prerelease tag keeps its suffix in the name but its semver core must match what is committed.
            $tagCore = ($core -split "-")[0]
            if ($tagCore -ne $pkg) {
              throw "Tag $tag says $tagCore but package.json says $pkg -- bump the version on the tagged commit, or tag the right commit."
            }
            # A dash in the tag is semver's prerelease marker, so GitHub marks those as prereleases.
            $pre = if ($core -match "-") { "true" } else { "false" }
            # Suffix into the filenames only, so a prerelease installer cannot share a name with the stable one.
            $suffix = if ($core -match "-") { ($core -split "-", 2)[1] } else { "" }
            $out = @("tag=$tag", "name=Karasu $core", "prerelease=$pre", "rolling=false", "version=$core", "suffix=$suffix")
            # The notes slicer throws on a missing CHANGELOG section; checked here so a tag without one fails before the build.
            ./scripts/release/release-notes.ps1 -Version $core -OutFile notes-precheck.md | Out-Null
            Remove-Item notes-precheck.md -ErrorAction SilentlyContinue
          }
          else {
            $out = @("tag=latest", "name=Nightly build", "prerelease=true", "rolling=true", "version=", "suffix=")
          }

          # Out-File with an explicit encoding, not >>: the redirect's default encoding is a shell-version detail.
          $out | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          $summary = ($out | ForEach-Object { $_ -replace "^[^=]+=", "" })
          Write-Host "Publishing to tag '$($summary[0])' as '$($summary[1])' (prerelease=$($summary[2]), rolling=$($summary[3]))"

  # Not a matrix leg: latest.json must describe both platforms at once, and the prune step must run exactly once.
  build-linux:
    runs-on: ubuntu-22.04
    # Hard, unlike the publisher's soft dependency: no point building for a tag that will be refused.
    needs: precheck
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libglib2.0-dev \
            libdbus-1-dev \
            patchelf \
            file

      - name: Cache Rust build
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Verify (typecheck + frontend tests + Rust tests)
        run: npm run verify

      - name: Build AppImage
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          NO_STRIP: true
        run: npx tauri build --config '{"bundle":{"createUpdaterArtifacts":true}}'

      # Confirm what the updater artifacts are called before trusting latest.json's linux-x86_64 url.
      - name: List bundle output
        run: ls -la src-tauri/target/release/bundle/appimage

      # Same suffix rule as precheck's, recomputed from the ref here rather than plumbed across jobs.
      - name: Rename AppImage to the full 4-part version
        shell: pwsh
        run: |
          $ref = "${env:GITHUB_REF}"
          $suffix = ""
          if ($ref -like "refs/tags/*") {
            $core = ($ref -replace "^refs/tags/", "") -replace "^v", ""
            if ($core -match "-") { $suffix = ($core -split "-", 2)[1] }
          }
          ./scripts/release/rename-appimage.ps1 -Suffix $suffix

      # The tray library is dlopen'd and invisible to linuxdeploy; warn only, a missing tray must not hold back a release.
      - name: Check the AppImage carries the tray library
        working-directory: src-tauri/target/release/bundle/appimage
        run: |
          ./*.AppImage --appimage-extract > /dev/null
          ls squashfs-root/usr/lib | grep -i appindicator \
            || echo "::warning::AppImage carries no appindicator library; the tray will be absent"
          rm -rf squashfs-root

      - name: Upload AppImage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: karasu-linux
          path: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/appimage/*.AppImage.sig
          if-no-files-found: error

  build-and-publish:
    runs-on: windows-latest
    # The only job that writes: it creates the release and prunes its assets.
    permissions:
      contents: write
    # !cancelled() rather than always(): a cancelled run must not publish over, or prune, the newer run's assets.
    needs: [precheck, build-linux, android-build]
    if: ${{ !cancelled() && needs.precheck.result == 'success' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      # continue-on-error, so a missing or failed Linux build degrades to a Windows-only release.
      - name: Download the Linux AppImage
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: karasu-linux
          path: linux-artifacts

      # Exists only when the android job found its signing secrets; absent, the release simply carries no APKs.
      - name: Download the Android APKs
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: karasu-android-release
          path: android-artifacts

      # tauri build runs no tests, so this gates the publish; the same line as ci.yml's, so the two cannot drift.
      - name: Verify (typecheck + frontend tests + Rust tests)
        run: npm run verify

      - name: Build release (NSIS installer)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx tauri build --config '{"bundle":{"createUpdaterArtifacts":true}}'

      - name: Rename installer to the full 4-part version
        id: installer
        shell: pwsh
        env:
          RELEASE_SUFFIX: ${{ needs.precheck.outputs.suffix }}
        run: ./scripts/release/rename-installer.ps1 -Suffix $env:RELEASE_SUFFIX

      # A stable manifest must not point into the rolling tag, and -Notes overrides the default sentence about main.
      - name: Generate update manifest (latest.json)
        shell: pwsh
        env:
          RELEASE_TAG: ${{ needs.precheck.outputs.tag }}
          RELEASE_NAME: ${{ needs.precheck.outputs.name }}
        run: >
          ./scripts/release/generate-update-manifest.ps1
          -Tag $env:RELEASE_TAG
          -Notes "$env:RELEASE_NAME -- see https://github.com/Kyusetzu/Karasu/releases/tag/$env:RELEASE_TAG"

      - name: Generate checksum
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path "src-tauri/target/release/bundle/nsis" -Filter *.exe |
              Sort-Object LastWriteTime -Descending |
              Select-Object -First 1
          $lines = @()
          $hash = Get-FileHash -Algorithm SHA256 -Path $installer.FullName
          $lines += "$($hash.Hash.ToLower())  $($installer.Name)"
          $appimage = Get-ChildItem -Path "linux-artifacts" -Filter *.AppImage -ErrorAction SilentlyContinue |
              Select-Object -First 1
          if ($appimage) {
            $h = Get-FileHash -Algorithm SHA256 -Path $appimage.FullName
            $lines += "$($h.Hash.ToLower())  $($appimage.Name)"
          }
          foreach ($apk in Get-ChildItem -Path "android-artifacts" -Filter *.apk -ErrorAction SilentlyContinue) {
            $h = Get-FileHash -Algorithm SHA256 -Path $apk.FullName
            $lines += "$($h.Hash.ToLower())  $($apk.Name)"
          }
          # LF explicitly: Out-File writes CRLF on Windows, and sha256sum -c then reads the \r as part of the filename.
          [IO.File]::WriteAllText(
            (Join-Path $PWD "SHA256SUMS.txt"),
            (($lines -join "`n") + "`n"),
            [Text.UTF8Encoding]::new($false)
          )

      - name: Scan installer with VirusTotal
        id: virustotal
        continue-on-error: true
        uses: crazy-max/ghaction-virustotal@936d8c5c00afe97d3d9a1af26d017cfdf26800a2 # v5
        with:
          vt_api_key: ${{ secrets.VT_API_KEY }}
          request_rate: 4
          files: |
            src-tauri/target/release/bundle/nsis/*.exe

      # A file rather than a body: block scalar, because ${{ }} substitutes CHANGELOG markdown textually into the YAML.
      - name: Compose release notes
        shell: pwsh
        env:
          NOTES_VERSION: ${{ needs.precheck.outputs.version }}
          NOTES_SHA: ${{ github.sha }}
          NOTES_VT: ${{ steps.virustotal.outputs.analysis || 'unavailable for this release' }}
        run: |
          # -Android only when APKs came down; a hashtable splat, since an array splat passes "-Android" as a positional string.
          $android = @{}
          if (Get-ChildItem -Path "android-artifacts" -Filter *.apk -ErrorAction SilentlyContinue) {
            $android = @{ Android = $true }
          }
          ./scripts/release/release-notes.ps1 `
            -Version $env:NOTES_VERSION `
            -Sha $env:NOTES_SHA `
            -VirusTotal $env:NOTES_VT `
            -OutFile notes.md @android

      # action-gh-release never moves an existing tag, and a stale latest tag pairs a current installer with old source.
      - name: Move the rolling tag to this commit
        if: ${{ needs.precheck.outputs.rolling == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh api -X PATCH "repos/${env:GITHUB_REPOSITORY}/git/refs/tags/latest" `
            -f sha="${env:GITHUB_SHA}" -F force=true | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "Could not move the rolling tag to ${env:GITHUB_SHA}." }

      # One publish step for both shapes, so the file list cannot drift between two copies.
      - name: Publish release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          tag_name: ${{ needs.precheck.outputs.tag }}
          name: ${{ needs.precheck.outputs.name }}
          prerelease: ${{ needs.precheck.outputs.prerelease }}
          body_path: notes.md
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            linux-artifacts/*.AppImage
            android-artifacts/*.apk
            SHA256SUMS.txt
            latest.json

      # Rolling only: a tag run's $keep would list the tag build's files and delete the rolling installer against them.
      - name: Prune stale release assets
        if: ${{ needs.precheck.outputs.rolling == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          # Through the environment, not ${{ }} in the script body, where a $ or " in the name would expand or run as code.
          INSTALLER: ${{ steps.installer.outputs.installer }}
        shell: pwsh
        run: |
          $keep = @($env:INSTALLER, "SHA256SUMS.txt", "latest.json")
          # From the downloaded folder rather than a cross-job output, or the prune deletes the AppImage it just uploaded.
          $appimage = Get-ChildItem -Path "linux-artifacts" -Filter *.AppImage -ErrorAction SilentlyContinue |
              Select-Object -First 1
          if ($appimage) { $keep += $appimage.Name }
          # The APKs too: anything uploaded but missing from $keep is deleted right after upload.
          foreach ($apk in Get-ChildItem -Path "android-artifacts" -Filter *.apk -ErrorAction SilentlyContinue) {
            $keep += $apk.Name
          }
          Write-Host "Keeping: $($keep -join ', ')"
          $assets = gh release view latest --json assets --jq '.assets[].name'
          if ($LASTEXITCODE -ne 0) { throw "Could not list the release's assets." }
          # Failures are collected and thrown at the end: the pwsh wrapper's exit code reflects the last gh call alone.
          $failed = @()
          foreach ($name in $assets) {
            if ($keep -notcontains $name) {
              Write-Host "Deleting stale asset: $name"
              gh release delete-asset latest $name --yes
              if ($LASTEXITCODE -ne 0) { $failed += $name }
            }
          }
          if ($failed) { throw "Could not delete: $($failed -join ', ')" }

  # No signing secrets, no release asset: a debug-signed APK must never be published, so it stays a workflow artifact.
  android-build:
    runs-on: ubuntu-22.04
    # Same reason as build-linux.
    needs: precheck
    env:
      # Job-level `if:` cannot read secrets; steps key off this instead.
      HAS_ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_B64 != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          # All four targets, because the universal release APK bundles every ABI; the debug leg only uses the first.
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Cache Rust build
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri

      # The runner ships the SDK; the NDK pin matches scripts/android-check.ps1 so the two builds cannot drift.
      - name: Install NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;27.1.12297006" "platforms;android-36" "build-tools;36.0.0" "build-tools;35.0.0" > /dev/null
          # Exported at run time, where ANDROID_HOME exists; the workflow's env context has no machine variables.
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.1.12297006" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: npm ci

      # ------------------------- without secrets -------------------------

      - name: Build debug APK
        if: env.HAS_ANDROID_KEYSTORE != 'true'
        run: npx tauri android build --apk --target aarch64 --debug

      - name: Upload debug APK
        if: env.HAS_ANDROID_KEYSTORE != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: karasu-android-debug
          path: src-tauri/gen/android/app/build/outputs/apk/universal/debug/app-universal-debug.apk
          if-no-files-found: error

      # -------------------------- with secrets ---------------------------

      # Into the gitignored key.properties Gradle reads; Java Properties format, so a backslash in a password needs escaping.
      - name: Materialize the signing keystore
        if: env.HAS_ANDROID_KEYSTORE == 'true'
        shell: pwsh
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          $ks = Join-Path $env:RUNNER_TEMP "upload.keystore"
          [IO.File]::WriteAllBytes($ks, [Convert]::FromBase64String($env:KEYSTORE_B64))
          $props = @(
            "storeFile=$ks"
            "storePassword=$env:KEYSTORE_PASSWORD"
            "keyAlias=$env:KEY_ALIAS"
            "keyPassword=$env:KEY_PASSWORD"
          )
          [IO.File]::WriteAllLines("src-tauri/gen/android/app/key.properties", $props)

      # Two invocations on purpose: --split-per-abi builds the per-ABI flavors instead of universal, not beside it.
      - name: Build release APKs (universal + arm64)
        if: env.HAS_ANDROID_KEYSTORE == 'true'
        run: |
          npx tauri android build --apk
          npx tauri android build --apk --target aarch64 --split-per-abi

      # Renamed to the 4-part version and collected flat, so the publisher's download sees bare *.apk names.
      - name: Rename and collect release APKs
        if: env.HAS_ANDROID_KEYSTORE == 'true'
        shell: pwsh
        run: |
          $ref = "${env:GITHUB_REF}"
          $suffix = ""
          if ($ref -like "refs/tags/*") {
            $core = ($ref -replace "^refs/tags/", "") -replace "^v", ""
            if ($core -match "-") { $suffix = ($core -split "-", 2)[1] }
          }
          $universal = ./scripts/release/rename-apk.ps1 -Flavor universal -Suffix $suffix
          $arm64 = ./scripts/release/rename-apk.ps1 -Flavor arm64 -Suffix $suffix
          New-Item -ItemType Directory -Force android-apks | Out-Null
          Copy-Item $universal android-apks/
          Copy-Item $arm64 android-apks/

      - name: Upload release APKs
        if: env.HAS_ANDROID_KEYSTORE == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: karasu-android-release
          path: android-apks/*.apk
          if-no-files-found: error
