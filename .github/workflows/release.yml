name: Release

on:
  push:
    branches: ["main"]

concurrency:
  group: release
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Build release (NSIS installer)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx tauri build --config '{"bundle":{"createUpdaterArtifacts":true}}'

      - name: Rename installer to the full 4-part version
        id: installer
        shell: pwsh
        run: ./scripts/release/rename-installer.ps1

      - name: Generate update manifest (latest.json)
        shell: pwsh
        run: ./scripts/release/generate-update-manifest.ps1

      - name: Generate checksum
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path "src-tauri/target/release/bundle/nsis" -Filter *.exe |
              Sort-Object LastWriteTime -Descending |
              Select-Object -First 1
          $hash = Get-FileHash -Algorithm SHA256 -Path $installer.FullName
          "$($hash.Hash.ToLower())  $($installer.Name)" | Out-File -FilePath SHA256SUMS.txt -Encoding utf8

      - name: Scan installer with VirusTotal
        id: virustotal
        continue-on-error: true
        uses: crazy-max/ghaction-virustotal@v5
        with:
          vt_api_key: ${{ secrets.VT_API_KEY }}
          request_rate: 4
          files: |
            src-tauri/target/release/bundle/nsis/*.exe

      - name: Publish rolling prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build
          prerelease: true
          body: |
            Automated build from the latest commit on `main` (${{ github.sha }}).

            This installer is **unsigned** — Windows SmartScreen may warn on
            first run. Verify the download against `SHA256SUMS.txt` if you
            want to confirm it wasn't tampered with in transit.

            Karasu's built-in updater (About page, or automatic daily checks)
            verifies updates against its own signing key regardless — see
            `latest.json` for the update manifest.

            VirusTotal scan: ${{ steps.virustotal.outputs.analysis || 'unavailable for this release' }}
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            SHA256SUMS.txt
            latest.json

      # The installer name carries the 4-part version, so every commit uploads
      # a differently-named asset that the publish step has nothing to
      # overwrite -- left alone, the rolling release accumulates one installer
      # per commit forever. Prune *after* uploading, so the release is never
      # momentarily without an installer for the updater to fetch.
      - name: Prune stale release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $keep = @("${{ steps.installer.outputs.installer }}", "SHA256SUMS.txt", "latest.json")
          Write-Host "Keeping: $($keep -join ', ')"
          $assets = gh release view latest --json assets --jq '.assets[].name'
          foreach ($name in $assets) {
            if ($keep -notcontains $name) {
              Write-Host "Deleting stale asset: $name"
              gh release delete-asset latest $name --yes
            }
          }
