name: Release

on:
  push:
    branches: ["main"]

concurrency:
  group: release
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Build release (NSIS installer)
        run: npm run tauri build

      - name: Generate checksum
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path "src-tauri/target/release/bundle/nsis" -Filter *.exe | Select-Object -First 1
          $hash = Get-FileHash -Algorithm SHA256 -Path $installer.FullName
          "$($hash.Hash.ToLower())  $($installer.Name)" | Out-File -FilePath SHA256SUMS.txt -Encoding utf8

      - name: Publish rolling prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build
          prerelease: true
          body: |
            Automated build from the latest commit on `main` (${{ github.sha }}).

            This installer is **unsigned** — Windows SmartScreen may warn on
            first run. Verify the download against `SHA256SUMS.txt` if you
            want to confirm it wasn't tampered with in transit.
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            SHA256SUMS.txt
