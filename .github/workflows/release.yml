name: Release

on:
  push:
    branches: ["main"]
    # A tag build is the immutable half. `main` keeps publishing the rolling
    # `latest` prerelease; `v*` publishes a release under its own tag, whose
    # assets the prune step at the bottom of this file cannot reach.
    tags: ["v*"]

# Keyed on the ref, not one global slot. `git push --follow-tags` delivers two
# separate push events — the branch, then the tag — and under a shared group
# with `cancel-in-progress` they cancel each other: either the rolling build
# dies, or the tag run does and leaves a git tag with no release behind it.
# `if: !cancelled()` cannot rescue that, because a run cancelled before its jobs
# start has no jobs left to evaluate it. Two quick pushes to `main` still
# serialise, which is what the original group was protecting.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

# Read by default; only the job that actually publishes gets write. This was
# workflow-wide `write`, which handed the same power to `build-linux` — a job
# that checks out, runs `npm ci` and uploads an artifact, and never touches the
# GitHub API. A compromised transitive npm dependency's install script, or any
# of the third-party actions in that job, could have read $GITHUB_TOKEN and
# pushed to main or replaced the published assets. ci.yml already had this
# right.
permissions:
  contents: read

jobs:
  # Builds the Linux artifact and hands it to the publisher below as an
  # artifact. A matrix was the obvious shape and the wrong one: every
  # post-build step here is PowerShell against `bundle/nsis`, `latest.json` has
  # to describe *both* platforms so it can only be written once both builds
  # exist, and the prune step would run twice with each leg deleting the
  # other's asset.
  #
  # ubuntu-22.04 for glibc reach — see ci.yml for the reasoning.
  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libglib2.0-dev \
            libdbus-1-dev \
            patchelf \
            file

      - name: Cache Rust build
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Verify (typecheck + frontend tests + Rust tests)
        run: npm run verify

      - name: Build AppImage
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          NO_STRIP: true
        run: npx tauri build --config '{"bundle":{"createUpdaterArtifacts":true}}'

      # First release run: confirm what the updater artifacts are actually
      # called before trusting latest.json's linux-x86_64 url.
      - name: List bundle output
        run: ls -la src-tauri/target/release/bundle/appimage

      - name: Rename AppImage to the full 4-part version
        shell: pwsh
        run: ./scripts/release/rename-appimage.ps1

      - name: Upload AppImage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: karasu-linux
          path: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/appimage/*.AppImage.sig
          if-no-files-found: error

  build-and-publish:
    runs-on: windows-latest
    # The only job that writes: it creates the release and prunes its assets.
    permissions:
      contents: write
    # Soft: `!cancelled()` plus continue-on-error on the download means a broken
    # Linux build costs the Linux artifact, not the Windows release. The
    # manifest generator emits only the platforms whose artifacts it finds.
    #
    # `!cancelled()` rather than `always()`: `always()` is true even when the
    # run has been cancelled, and this workflow sets cancel-in-progress. Two
    # pushes in quick succession — routine here, since every commit bumps the
    # version — would cancel run A's Linux job and let A publish anyway, racing
    # run B. If A landed second it would overwrite latest.json with the older
    # build and its prune step would delete B's assets, since B's filenames are
    # not in A's $keep. `!cancelled()` keeps the soft dependency identically and
    # closes that.
    needs: [build-linux]
    if: ${{ !cancelled() }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Which release this run is, decided once. Everything downstream reads
      # these outputs, so the three literals that used to be `latest` / `Latest
      # build` / `prerelease: true` live in exactly one place.
      #
      # First, and deliberately before the ~15-minute build: a tag that
      # disagrees with the commit it points at fails in seconds rather than
      # producing a release called 1.0.0 whose installer says 0.132.0. The
      # scripts read the version off disk at the tagged commit, so nothing else
      # would ever catch that.
      - name: Resolve release target
        id: target
        shell: pwsh
        run: |
          $ref = "${env:GITHUB_REF}"
          if ($ref -like "refs/tags/*") {
            $tag = $ref -replace "^refs/tags/", ""
            $core = $tag -replace "^v", ""
            $pkg = (Get-Content package.json -Raw | ConvertFrom-Json).version
            # A prerelease tag (v1.0.0-rc1) keeps its suffix in the name but
            # must still agree on the semver core with what is committed.
            $tagCore = ($core -split "-")[0]
            if ($tagCore -ne $pkg) {
              throw "Tag $tag says $tagCore but package.json says $pkg -- bump the version on the tagged commit, or tag the right commit."
            }
            # `-` in the tag is semver's prerelease marker; GitHub should mark
            # those as prereleases and a bare v1.0.0 as a real one.
            $pre = if ($core -match "-") { "true" } else { "false" }
            $out = @("tag=$tag", "name=Karasu $core", "prerelease=$pre", "rolling=false", "version=$core")
            # The notes are composed after the build, from CHANGELOG.md, and
            # the slicer throws when the section is missing. Checked here too,
            # so a tag with no changelog entry costs seconds rather than
            # failing at the end of a fifteen-minute build with the tag
            # already pushed and no release to show for it. Note this means a
            # prerelease tag needs its own `## 1.0.0-rc1` section.
            ./scripts/release/release-notes.ps1 -Version $core -OutFile notes-precheck.md | Out-Null
            Remove-Item notes-precheck.md -ErrorAction SilentlyContinue
          }
          else {
            $out = @("tag=latest", "name=Latest build", "prerelease=true", "rolling=true", "version=")
          }
          # `Out-File -Append -Encoding utf8`, the same idiom rename-installer.ps1
          # already uses, rather than `>>` — the redirect's default encoding is
          # a shell-version detail and this file is parsed by the runner.
          $out | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          $summary = ($out | ForEach-Object { $_ -replace "^[^=]+=", "" })
          Write-Host "Publishing to tag '$($summary[0])' as '$($summary[1])' (prerelease=$($summary[2]), rolling=$($summary[3]))"

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      # Flattened into linux-artifacts/. continue-on-error so a missing or
      # failed Linux build degrades to a Windows-only release rather than
      # taking the whole thing down.
      - name: Download the Linux AppImage
        continue-on-error: true
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: karasu-linux
          path: linux-artifacts

      # This job publishes straight to users, and it triggers on the same push
      # as ci.yml rather than after it, so nothing was gating it. `tauri build`
      # only runs `vite build` -- no typecheck, no vitest, no cargo test -- so a
      # failing test could ship while CI went red beside it. Same line as
      # ci.yml's, verbatim, so the two cannot drift.
      - name: Verify (typecheck + frontend tests + Rust tests)
        run: npm run verify

      - name: Build release (NSIS installer)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx tauri build --config '{"bundle":{"createUpdaterArtifacts":true}}'

      - name: Rename installer to the full 4-part version
        id: installer
        shell: pwsh
        run: ./scripts/release/rename-installer.ps1

      # The tag matters here more than anywhere else: the manifest's download
      # URL is built from it, and a stable release whose manifest points into
      # the rolling tag has its installer deleted by the prune step on the next
      # unrelated push to main.
      - name: Generate update manifest (latest.json)
        shell: pwsh
        env:
          RELEASE_TAG: ${{ steps.target.outputs.tag }}
        run: ./scripts/release/generate-update-manifest.ps1 -Tag $env:RELEASE_TAG

      - name: Generate checksum
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path "src-tauri/target/release/bundle/nsis" -Filter *.exe |
              Sort-Object LastWriteTime -Descending |
              Select-Object -First 1
          $lines = @()
          $hash = Get-FileHash -Algorithm SHA256 -Path $installer.FullName
          $lines += "$($hash.Hash.ToLower())  $($installer.Name)"
          $appimage = Get-ChildItem -Path "linux-artifacts" -Filter *.AppImage -ErrorAction SilentlyContinue |
              Select-Object -First 1
          if ($appimage) {
            $h = Get-FileHash -Algorithm SHA256 -Path $appimage.FullName
            $lines += "$($h.Hash.ToLower())  $($appimage.Name)"
          }
          # LF, explicitly. `Out-File` terminates lines with the platform's
          # newline, and this step runs on windows-latest — so the file went out
          # with CRLF. GNU coreutils takes everything after the two-space
          # separator as the filename, trailing \r included, so `sha256sum -c`
          # reported "FAILED open or read" for every line. The release body
          # tells Linux users to verify with exactly that command.
          [IO.File]::WriteAllText(
            (Join-Path $PWD "SHA256SUMS.txt"),
            (($lines -join "`n") + "`n"),
            [Text.UTF8Encoding]::new($false)
          )

      - name: Scan installer with VirusTotal
        id: virustotal
        continue-on-error: true
        uses: crazy-max/ghaction-virustotal@936d8c5c00afe97d3d9a1af26d017cfdf26800a2 # v5
        with:
          vt_api_key: ${{ secrets.VT_API_KEY }}
          request_rate: 4
          files: |
            src-tauri/target/release/bundle/nsis/*.exe

      # Written to a file rather than passed as a `body:` block scalar. A
      # `${{ }}` in YAML is textual substitution before anything parses it, and
      # for a tagged release this body is arbitrary CHANGELOG markdown — full of
      # backticks, dollars and quotes, in a job holding the signing key. The
      # prune step below already documents that class of bug for a single
      # filename; this is worse input.
      - name: Compose release notes
        shell: pwsh
        env:
          NOTES_VERSION: ${{ steps.target.outputs.version }}
          NOTES_SHA: ${{ github.sha }}
          NOTES_VT: ${{ steps.virustotal.outputs.analysis || 'unavailable for this release' }}
        run: >
          ./scripts/release/release-notes.ps1
          -Version $env:NOTES_VERSION
          -Sha $env:NOTES_SHA
          -VirusTotal $env:NOTES_VT
          -OutFile notes.md

      # One publish step for both shapes. A second copy would duplicate the
      # whole file list, and the two would drift the first time one changed.
      - name: Publish release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          tag_name: ${{ steps.target.outputs.tag }}
          name: ${{ steps.target.outputs.name }}
          prerelease: ${{ steps.target.outputs.prerelease }}
          body_path: notes.md
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            linux-artifacts/*.AppImage
            SHA256SUMS.txt
            latest.json

      # The installer name carries the 4-part version, so every commit uploads
      # a differently-named asset that the publish step has nothing to
      # overwrite -- left alone, the rolling release accumulates one installer
      # per commit forever. Prune *after* uploading, so the release is never
      # momentarily without an installer for the updater to fetch.
      #
      # Rolling builds only. The `gh` calls below are already scoped to the
      # literal tag `latest`, so a tagged release's assets are safe from this by
      # construction — but on a tag run it would compute `$keep` from the *tag*
      # build's filenames and then delete the rolling installer against that
      # list, seconds after an unrelated push published it. Guarded by `if:`,
      # never by emptying `$keep`.
      - name: Prune stale release assets
        if: ${{ steps.target.outputs.rolling == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          # Through the environment, not `${{ }}` inside the script body. A
          # workflow expression is substituted textually before pwsh parses the
          # line, and it landed inside a double-quoted string where `$` and `"`
          # are both live — so a productName containing `$` would have silently
          # expanded to nothing (the real installer then missing from $keep and
          # deleted seconds after upload), and one containing `"` would have
          # closed the string and run as code, in a job holding the signing key.
          INSTALLER: ${{ steps.installer.outputs.installer }}
        shell: pwsh
        run: |
          $keep = @($env:INSTALLER, "SHA256SUMS.txt", "latest.json")
          # Read from the downloaded folder rather than plumbing an output
          # across jobs — and it must be here, or the prune deletes the
          # AppImage seconds after uploading it.
          $appimage = Get-ChildItem -Path "linux-artifacts" -Filter *.AppImage -ErrorAction SilentlyContinue |
              Select-Object -First 1
          if ($appimage) { $keep += $appimage.Name }
          Write-Host "Keeping: $($keep -join ', ')"
          $assets = gh release view latest --json assets --jq '.assets[].name'
          if ($LASTEXITCODE -ne 0) { throw "Could not list the release's assets." }
          # Failures are collected and thrown at the end rather than ignored.
          # The pwsh wrapper only appends `exit $LASTEXITCODE` once, so the
          # step's status reflected the *last* gh call alone: a transient
          # failure on the first deletion was overwritten by a later success,
          # the run stayed green, and the stale installer survived — the one
          # thing this step exists to prevent.
          $failed = @()
          foreach ($name in $assets) {
            if ($keep -notcontains $name) {
              Write-Host "Deleting stale asset: $name"
              gh release delete-asset latest $name --yes
              if ($LASTEXITCODE -ne 0) { $failed += $name }
            }
          }
          if ($failed) { throw "Could not delete: $($failed -join ', ')" }
