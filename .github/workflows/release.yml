name: Release

on:
  push:
    branches: ["main"]

concurrency:
  group: release
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Build release (NSIS installer)
        run: npm run tauri build

      - name: Rename installer to the full 4-part version
        shell: pwsh
        run: ./scripts/rename-installer.ps1

      # Signing is opt-in: it only runs once SIGNPATH_* repo variables/secrets
      # are configured (see SIGNING.md). Until then these steps are skipped
      # and the release stays unsigned, same as before.
      - name: Upload unsigned installer for signing
        if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
        id: upload-unsigned-artifact
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          retention-days: 1

      - name: Submit signing request to SignPath
        if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: "${{ secrets.SIGNPATH_API_TOKEN }}"
          organization-id: "${{ vars.SIGNPATH_ORGANIZATION_ID }}"
          project-slug: "${{ vars.SIGNPATH_PROJECT_SLUG }}"
          signing-policy-slug: "${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}"
          github-artifact-id: "${{ steps.upload-unsigned-artifact.outputs.artifact-id }}"
          wait-for-completion: true
          output-artifact-directory: "src-tauri/target/release/bundle/nsis"

      - name: Generate checksum
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path "src-tauri/target/release/bundle/nsis" -Filter *.exe | Select-Object -First 1
          $hash = Get-FileHash -Algorithm SHA256 -Path $installer.FullName
          "$($hash.Hash.ToLower())  $($installer.Name)" | Out-File -FilePath SHA256SUMS.txt -Encoding utf8

      - name: Prepare release notes
        id: release-notes
        shell: pwsh
        run: |
          $signed = "${{ vars.SIGNPATH_ORGANIZATION_ID }}" -ne ""
          if ($signed) {
            $note = "This installer is signed via SignPath. Verify against ``SHA256SUMS.txt`` if you'd like."
          } else {
            $note = "This installer is **unsigned** -- Windows SmartScreen may warn on first run. Verify the download against ``SHA256SUMS.txt`` if you want to confirm it wasn't tampered with in transit."
          }
          $body = "Automated build from the latest commit on ``main`` (${{ github.sha }}).`n`n$note"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "body<<EOF"
          Add-Content -Path $env:GITHUB_OUTPUT -Value $body
          Add-Content -Path $env:GITHUB_OUTPUT -Value "EOF"

      - name: Publish rolling prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build
          prerelease: true
          body: ${{ steps.release-notes.outputs.body }}
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            SHA256SUMS.txt
