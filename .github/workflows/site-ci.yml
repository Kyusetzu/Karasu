name: Site

# The website's PR gate, since ci.yml ignores site/**: the same check and build as pages.yml, minus the deploy.
on:
  pull_request:
    paths:
      - "site/**"
      - "src/app/index.css"
      - ".github/workflows/site-ci.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  site-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check (typecheck + token freshness)
        run: npm run check

      - name: Build (prerender + verify-dist)
        run: npm run build
