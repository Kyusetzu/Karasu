<html>

    <!-- Only what VirtualRows needs: without `.absolute` the rows double-space and look like a virtualizer bug. -->

      .relative { position: relative }
      .absolute { position: absolute }
      .left-0 { left: 0 }
      .top-0 { top: 0 }
      .w-full { width: 100% }
      body { margin: 0 }
    </style>
  </head>

    <div id="root"></div>
    <script type="module" src="/harness.tsx"></script>
  </body>
</html>
