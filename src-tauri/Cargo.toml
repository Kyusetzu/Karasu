[package]
name = "karasu"
version = "0.3.0"
description = "A modern anime and manga tracker for Windows, built exclusively for AniList"
authors = ["Kyu"]
license = "MIT"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "karasu_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# reqwest 0.13 already defaults to rustls (pure-Rust TLS, no OpenSSL/schannel),
# which is leaner to build and cross-platform for the Linux groundwork.
reqwest = { version = "0.13", features = ["json"] }
tokio = { version = "1", features = ["time", "sync", "macros"] }
keyring = { version = "3", features = ["windows-native"] }
rusqlite = { version = "0.40", features = ["bundled"] }
regex = "1"
discord-rich-presence = "1"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Threading",
    "Win32_Security_Cryptography",
] }

# --- Build-speed tuning -----------------------------------------------------
# Dev: keep incremental on and trim debug info to the minimum needed for
# backtraces — the link step is the slow part of each rebuild.
[profile.dev]
incremental = true
debug = "line-tables-only"

# Release: default codegen-units (16) already parallelises; skip LTO so the
# bundle build stays fast (this app is I/O-bound, not CPU-bound).
[profile.release]
lto = false
codegen-units = 16
strip = true

