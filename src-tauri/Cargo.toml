[package]
name = "karasu"
version = "0.108.0"
description = "A modern anime and manga tracker built exclusively for AniList"
authors = ["Kyu"]
license = "MIT"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lints.rust]
# MSVC's link.exe prints "Creating library … and object …" on stdout for every
# artifact that exports symbols, and rustc's warn-by-default `linker_messages`
# forwards it verbatim — in the system language, which made two routine German
# notices look like build problems. Nothing failed; it is link.exe narrating.
#
# Scoped to this package on purpose. The same suppression via `rustflags` in
# `.cargo/config.toml` would apply to the whole dependency graph — silencing a
# linker complaint that *would* be worth seeing, and invalidating both CI
# caches. A crate-level `#![allow]` would need writing twice, in `lib.rs` and
# `main.rs`, because it is evaluated per linked crate root.
linker_messages = "allow"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "karasu_lib"
# `rlib` only. The Tauri template's default is
# `["staticlib", "cdylib", "rlib"]`, where `staticlib` is for iOS and `cdylib`
# for Android — and Karasu ships Windows and Linux desktop, so both were built
# and thrown away on every release build. `main.rs` reaches `run()` through the
# rlib, so the desktop path is unaffected.
#
# This is a *disk* change, not a speed one, and the distinction is the whole
# reason it is written down. Measured on identical source, two runs each:
# rlib-only 35.5s / 34.5s, all three 34.7s / 35.1s — no difference, because the
# static archive is a cheap concatenation of objects that were already compiled.
# What it does save is real though: both artifacts are rewritten on every build
# (verified by mtime), so this is ~170 MB of pointless writes per build that an
# SSD no longer has to take.
#
# Restoring the two entries is the one-line revert if mobile ever happens; the
# `#[cfg_attr(mobile, tauri::mobile_entry_point)]` in `lib.rs` stays as the
# marker for where that would start.
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# reqwest 0.13 already defaults to rustls (pure-Rust TLS, no OpenSSL/schannel),
# which is leaner to build and cross-platform for the Linux groundwork.
#
# `gzip` sends Accept-Encoding and decompresses transparently. Without it the
# MediaListCollection response — the largest and most frequent payload, fetched
# twice on every cold start — comes down uncompressed. Measured against the live
# API: 74,196 bytes plain vs 25,531 gzipped, a 66% saving.
#
# Deliberately gzip only. AniList also speaks brotli, but it *prefers* br when
# offered both, and br came back larger here (26,401 bytes) — so enabling
# reqwest's `brotli` feature on top would make the transfer slightly worse.
reqwest = { version = "0.13", features = ["json", "gzip"] }
tokio = { version = "1", features = ["time", "sync", "macros"] }
rusqlite = { version = "0.40", features = ["bundled"] }
regex = "1"
discord-rich-presence = "1"
# MPRIS hands over a `file://` URL for local playback, and the file name inside
# it is the release name — better parser input than any composed title. Not
# hand-rolled: multi-byte UTF-8 and malformed `%` are exactly the cases a
# fifteen-line decoder gets wrong, and this is already in the tree.
percent-encoding = "2"
# The Wrapped poster crosses the IPC bridge as base64 text. Tauri serializes a
# command's arguments with `JSON.stringify`, and its replacer turns any byte
# array into a JSON array of numbers — about four ASCII characters per byte,
# then parsed back one number at a time. Base64 is ~1.37x instead of ~4x and
# costs a single decode. Was Linux-only (portable-key storage); the poster
# needs it everywhere.
base64 = "0.22"
# The OAuth `state` nonce. Already in the graph three times over via rustls and
# friends; this makes the one use that must be cryptographically random an
# explicit dependency rather than a borrowed one.
getrandom = "0.3"

# --- Platform-specific -------------------------------------------------------
# Windows: Credential Manager keyring + DPAPI (via the `windows` crate).
[target.'cfg(windows)'.dependencies]
keyring = { version = "3", features = ["windows-native"] }
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Threading",
    "Win32_Security_Cryptography",
    # WinRT: Accessibility text scale (UI_ViewManagement) and the global media
    # session list (Media_Control) used as a detection source.
    "UI_ViewManagement",
    "Media",
    "Media_Control",
    "Foundation",
    "Foundation_Collections",
    "Win32_System_Com",
] }
# The blocking `join()` on WinRT async operations lives here, not in `windows`.
windows-future = "0.3"

# Linux groundwork: keyring via the Secret Service (libsecret/D-Bus).
[target.'cfg(target_os = "linux")'.dependencies]
# The desktop's media sessions live on D-Bus here. zbus rather than the
# `mpris`/`dbus-rs` crates because it is pure Rust and is already compiled into
# this tree by tauri-plugin-opener, -single-instance and notify-rust, so it
# costs no new dependency graph. Default features on purpose: they are
# `async-io` + `blocking-api`, and the rest of the tree already unified on
# async-io — asking for the tokio feature would enable both stacks for nothing.
zbus = "5"
# Portable-mode token encryption. A real new subtree — nothing RustCrypto is in
# the tree today — but small and pure-Rust. XChaCha20's 24-byte nonce is what
# makes a randomly generated nonce per write safe without a counter to keep.
chacha20poly1305 = "0.10"
# `cfg(target_os = "linux")`, not `cfg(unix)`: sync-secret-service is a D-Bus
# backend and macOS has none — it needs `apple-native`. The old predicate only
# "worked" because nobody has ever built for macOS. This way a macOS build
# fails at the manifest instead of compiling a backend that cannot work.
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust"] }

# --- Build-speed tuning -----------------------------------------------------
# Dev: keep incremental on and trim debug info to the minimum needed for
# backtraces — the link step is the slow part of each rebuild.
[profile.dev]
incremental = true
debug = "line-tables-only"

# Release: default codegen-units (16) already parallelises; skip LTO so the
# bundle build stays fast (this app is I/O-bound, not CPU-bound).
[profile.release]
# Do not add `panic = "abort"` here. `lib.rs` catches the panic
# `libappindicator-sys` raises when it cannot dlopen the AppIndicator library,
# which is how the app still starts on a Linux desktop that has none. With
# `abort` that panic kills the process instead, and the catch is silently dead.
lto = false
codegen-units = 16
strip = true

